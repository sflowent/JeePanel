<mat-form-field class="full-width-field">
    <mat-select [(ngModel)]="dashboardSelected" (selectionChange)="onDashboardSelected()">
      @for (dashboard of dashboards; track dashboard) {
        <mat-option [value]="dashboard">
          {{ dashboard.settings.title }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
